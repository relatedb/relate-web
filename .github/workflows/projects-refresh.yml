# Refreshes the projects store, src/data/projects.relate, behind /projects/ (ADR-0076): the GitHub
# repositories tagged `relate`, kept as a relate graph (a directory store, json codec). Weekly and by hand; opens a pull request when the list changed,
# so a person reads what is about to appear on the site.
#
# The pull request is opened with RELEASE_PR_TOKEN when it is set, so its required checks start;
# with the job's own token they do not (GitHub's rule) and need a re-run or an empty commit.
name: Projects refresh

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: projects-refresh
  cancel-in-progress: false

env:
  DO_NOT_TRACK: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Search GitHub and update the store
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/projects.ts

      - name: Open the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          base: main
          branch: projects-refresh
          delete-branch: true
          add-paths: src/data/projects.relate
          commit-message: 'Projects: refresh the list from GitHub'
          title: 'Projects: refresh the list from GitHub'
          body: |
            The weekly refresh of the projects store, `src/data/projects.relate`: repositories tagged
            `relate` on GitHub (ADR-0076). `graph.json` is one line, so read the change with
            `git diff --word-diff=porcelain` or query the store. To leave a project out, set
            `hidden` on it: `relate query --database src/data/projects.relate "MATCH (p:Project {fullName: 'owner/name'}) SET p.hidden = true"`.
