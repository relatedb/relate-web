# Refreshes src/data/projects.json, the data behind /projects/ (ADR-0076): the GitHub
# repositories tagged `relate`. Weekly and by hand; opens a pull request when the list changed,
# so a person reads what is about to appear on the site.
#
# The pull request is opened with RELEASE_PR_TOKEN when it is set, so its required checks start;
# with the job's own token they do not (GitHub's rule) and need a re-run or an empty commit.
name: Projects refresh

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: projects-refresh
  cancel-in-progress: false

env:
  DO_NOT_TRACK: '1'

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Search GitHub for the topic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/projects.ts

      - name: Open the pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}
          base: main
          branch: projects-refresh
          delete-branch: true
          add-paths: src/data/projects.json
          commit-message: 'Projects: refresh the list from GitHub'
          title: 'Projects: refresh the list from GitHub'
          body: |
            The weekly refresh of `src/data/projects.json`: repositories tagged `relate` on GitHub
            (ADR-0076). Read the diff for anything that should not be listed; a removal is a line in
            `src/data/projects-curation.json`.
