# Runs the docs' verified language samples (```python run, ```js run,
# ```rust run, ```java run, ```csharp run, ```go run, ```swift run and
# ```c run fences; the
# contract is in src/lib/docs/samples.ts) against the relate clients, and
# fails when a sample no longer builds, runs, or prints its recorded result
# (DOCS-PLAN.md §6, "Language samples are verified from phase 1").
#
# Weekly and on demand; not a required check, because it needs the network
# (the registries and the public upstream repository) and takes long.
# scripts/samples/setup.sh installs relate-db, @relate/relate, the relate
# crate and ai.relatedb:relate from PyPI, npm, crates.io and Maven Central at
# src/content/docs/_data/engine.json's version, and builds the .NET, Go, Swift
# and C clients from an upstream checkout at that version's tag (ADR-0062,
# ADR-0071, ADR-0072).
#
# The checkout is the `ref` input, else the tag v<version>. A `ref` at another
# version fails setup, which holds the checkout to the registry clients'
# version.
#
# Two jobs, so each language runs where its client builds:
#   samples  ubuntu: Python, Node.js, Rust, Java, .NET, Go and C. The JDK
#            comes from actions/setup-java (Temurin 21), the .NET SDK from
#            actions/setup-dotnet and Go from actions/setup-go;
#            scripts/samples/setup.sh downloads Maven and checks it against
#            the SHA-512 it pins, as it does locally.
#   swift    macOS: the Swift client's binary target is an XCFramework, which
#            SwiftPM uses on Apple platforms only, and xcodebuild makes it.
#            Only the FFI library is built there, so the macOS minutes stay
#            few.
#
# A failure prints each sample's recorded and actual output. If the engine
# changed on purpose, set up the clients locally (scripts/samples/setup.sh),
# run `npm run docs:samples -- --record` and commit the reviewed diff, or run
# this workflow by hand with `record_to` set to the branch: the samples job
# records the Linux languages and uploads the diff, and the swift job (after it)
# applies that diff, records Swift and commits the result to the branch. The
# commit is pushed with RELEASE_PR_TOKEN when set (as in docs-embeddings.yml),
# so the pull request's checks start.
name: Docs samples

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      ref:
        description: Upstream ref to build the .NET, Go, Swift and C clients from (default v<engine version>)
        required: false
        default: ''
      record_to:
        description: Re-record the samples and commit them to this branch (for example engine-release/v1.3.0); empty only verifies
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: docs-samples
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'
  UPSTREAM_REPO: ${{ vars.RELATE_UPSTREAM_REPO || 'relatedb/relate' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.gate.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.record_to || github.ref }}

      - name: Upstream ref
        id: gate
        env:
          INPUT_REF: ${{ inputs.ref }}
        run: |
          ref="$INPUT_REF"
          if [ -z "$ref" ]; then
            ref="v$(node -p 'require("./src/content/docs/_data/engine.json").version')"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  samples:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
          ref: ${{ inputs.record_to || github.ref }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.gate.outputs.ref }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: false

      # The toolchain upstream pins (upstream/rust-toolchain.toml); rustup is
      # preinstalled on the runner.
      - name: Install the Rust toolchain
        working-directory: upstream
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build the clients
        working-directory: site
        run: >-
          bash scripts/samples/setup.sh --upstream ../upstream --out "$RUNNER_TEMP/samples"
          --python python3 --crewai-python python3 --jdk "$JAVA_HOME" --skip-swift --github-env

      - name: Run the samples
        if: inputs.record_to == ''
        working-directory: site
        run: node scripts/docs-samples.ts --require --lang python,js,rust,java,csharp,go,c

      - name: Record the samples
        if: inputs.record_to != ''
        working-directory: site
        run: |
          node scripts/docs-samples.ts --record --require --lang python,js,rust,java,csharp,go,c
          git add -A
          git diff --cached --binary > "$RUNNER_TEMP/samples.patch"
          wc -c "$RUNNER_TEMP/samples.patch"

      - uses: actions/upload-artifact@v7
        if: inputs.record_to != ''
        with:
          name: samples-patch
          path: ${{ runner.temp }}/samples.patch

  swift:
    # After the Linux job, so a recording can build on its diff; a failure there
    # does not stop the verification of Swift.
    needs: [gate, samples]
    if: ${{ !cancelled() && needs.gate.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
          ref: ${{ inputs.record_to || github.ref }}
          token: ${{ secrets.RELEASE_PR_TOKEN || github.token }}

      - uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.gate.outputs.ref }}
          path: upstream
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the Rust toolchain
        working-directory: upstream
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustc --version
          swift --version

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build the Swift client
        working-directory: site
        run: >-
          bash scripts/samples/setup.sh --upstream ../upstream --out "$RUNNER_TEMP/samples"
          --skip-python --skip-node --skip-rust --skip-java --skip-dotnet --skip-go --skip-c --github-env

      - name: Run the samples
        if: inputs.record_to == ''
        working-directory: site
        run: node scripts/docs-samples.ts --require --lang swift

      - uses: actions/download-artifact@v8
        if: inputs.record_to != ''
        with:
          name: samples-patch
          path: ${{ runner.temp }}/patch

      - name: Record Swift and commit the samples
        if: inputs.record_to != ''
        working-directory: site
        env:
          REF: ${{ inputs.record_to }}
        run: |
          git apply --whitespace=nowarn "$RUNNER_TEMP/patch/samples.patch"
          node scripts/docs-samples.ts --record --require --lang swift
          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "::notice::the samples are current: nothing to commit"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Docs: re-record the language samples'
          git push origin "HEAD:refs/heads/$REF"

