<svg id="write-path-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px;" viewBox="0 0 760 1108" role="img" aria-labelledby="write-path-light-title write-path-light-desc"><title id="write-path-light-title">The write path, what each durability mode can lose in a crash and the parts of one .rl file, as relate documents them</title><desc id="write-path-light-desc">The write path, after two commits: In memory: a statement, its commit record, and the in-memory graph (commits up to LSN 3). On disk: the WAL (00000002.log holding LSN 2, 3 (open)) and the snapshot at checkpoint LSN 1. A commit record is appended to the WAL, then applied to the graph; a checkpoint writes the graph to the snapshot and recycles the segments it covers; an open loads the snapshot and replays the WAL. What a crash 4.6 s after a checkpoint can lose: Acknowledged writes on a ten-second timeline after a completed checkpoint, with a crash at 4.6 s. Under full, all 8 writes acknowledged before the crash come back: each returned only after its WAL record was synced. Under everysecond, the last background sync was at 4 s, so the 2 writes acknowledged in the 0.6 s after it can be lost. Slow storage or a delayed sync makes the window longer. Under snapshot, nothing is synced on commit, so all 8 writes acknowledged since the last completed checkpoint can be lost. The next timed checkpoint is due at 300 s; a WAL segment that fills, or a clean close, checkpoints sooner. One .rl file, after a checkpoint: One .rl file holding, top to bottom: the superblock (MDBCLB01, version 1); the snapshot (manifest.json and the codec's files) at checkpoint LSN 3; the WAL (00000003.log with no records); and space the file keeps from parts it no longer needs and reuses for later writes. The parts are drawn in logical order, not to scale.</desc><style>#write-path-light{font-family:"Relate Sans",system-ui,sans-serif}#write-path-light{font-family:"Relate Sans",system-ui,sans-serif}#write-path-light .zone{fill:none;stroke:#E4E7E8;stroke-width:1;stroke-dasharray:6 5}#write-path-light .zl{font-size:12px;font-weight:600;fill:#59656A;letter-spacing:.04em}#write-path-light .box{fill:#FAFAFA;stroke:#5F6A6E;stroke-width:1.5}#write-path-light .on .box{fill:#CDDBE2;stroke:#0A6190;stroke-width:2.5}#write-path-light .gone .box{fill:none;stroke-dasharray:5 4}#write-path-light .t{font-size:14px;font-weight:600;fill:#0A1114}#write-path-light .s{font-size:12px;fill:#59656A}#write-path-light .m{font-family:"Relate Mono",ui-monospace,monospace;font-size:11.5px;fill:#0A1114}#write-path-light .pt{font-size:15px;font-weight:600;fill:#0A1114}#write-path-light .arrow path{fill:none;stroke:#5F6A6E;stroke-width:1.5}#write-path-light .arrow polygon{fill:#5F6A6E}#write-path-light .arrow.dash path{stroke-dasharray:5 4}#write-path-light .arrow.on path{stroke:#0A6190;stroke-width:2.5}#write-path-light .arrow.on polygon{fill:#0A6190}#write-path-light .al{font-size:12px;fill:#59656A}#write-path-light .arrow.on .al{fill:#0A1114;font-weight:600}#write-path-light .rec{fill:#E8E8E8;stroke:#5F6A6E;stroke-width:1}#write-path-light .rec.new{fill:#CDDBE2;stroke:#0A6190;stroke-width:2}#write-path-light .rt{font-size:10.5px;fill:#0A1114;text-anchor:middle}#write-path-light .seg{fill:#F2F2F2;stroke:#E4E7E8;stroke-width:1}#write-path-light .sync{fill:#CED9D4;stroke:#145439;stroke-width:1.5}#write-path-light .syt{font-size:11px;font-weight:600;fill:#0A1114}#write-path-light .free{fill:none;stroke:#5F6A6E;stroke-width:1.2;stroke-dasharray:4 4}#write-path-light .axis{stroke:#59656A;stroke-width:1}#write-path-light .tick{stroke:#59656A;stroke-width:1}#write-path-light .tl{font-size:11px;fill:#59656A;text-anchor:middle}#write-path-light .cp{stroke:#0A1114;stroke-width:2.5}#write-path-light .sy{stroke:#145439;stroke-width:2}#write-path-light .crash{stroke:#B02A00;stroke-width:2.5}#write-path-light .ct{font-size:12px;font-weight:600;fill:#B02A00}#write-path-light .win{fill:#E7D2CB;stroke:#B02A00;stroke-width:1;stroke-dasharray:4 3}#write-path-light .ok{fill:#145439;stroke:#145439;stroke-width:1.5}#write-path-light .lost{fill:#F2F2F2;stroke:#B02A00;stroke-width:2}#write-path-light .x{stroke:#B02A00;stroke-width:1.8}#write-path-light .mode{font-family:"Relate Mono",ui-monospace,monospace;font-size:13px;font-weight:600;fill:#0A1114}#write-path-light .row.on .mode{fill:#0A6190}#write-path-light .wt{font-size:11.5px;font-weight:600;fill:#B02A00}#write-path-light .note{font-size:12px;fill:#59656A}#write-path-light .band{fill:#FAFAFA;stroke:#5F6A6E;stroke-width:1.2}#write-path-light .on .band{fill:#CDDBE2;stroke:#0A6190;stroke-width:2.5}#write-path-light .file{fill:#F2F2F2;stroke:#0A1114;stroke-width:2}</style><text class="pt" x="12" y="22">The write path, after two commits</text><g transform="translate(0 32)"><rect class="zone" x="8" y="8" width="744" height="124" rx="8"/><text class="zl" x="18" y="26">IN MEMORY</text><rect class="zone" x="8" y="156" width="744" height="128" rx="8"/><text class="zl" x="18" y="174">ON DISK, IN THE STORE</text><g class="arrow" data-part="run"><path d="M160 77 L200 77"/><polygon points="200,77 191,81.5 191,72.5"/></g><g class="arrow" data-part="apply"><path d="M350 77 L540 77"/><polygon points="540,77 531,81.5 531,72.5"/><text class="al" x="445" y="70" text-anchor="middle">apply</text></g><g class="arrow" data-part="append"><path d="M275 108 L275 196"/><polygon points="275,196 270.5,187 279.5,187"/><text class="al" x="283" y="146">append</text></g><g class="arrow" data-part="checkpoint"><path d="M600 108 L600 196"/><polygon points="600,196 595.5,187 604.5,187"/><text class="al" x="592" y="146" text-anchor="end">checkpoint</text></g><g class="arrow dash" data-part="load"><path d="M670 196 L670 108"/><polygon points="670,108 674.5,117 665.5,117"/><text class="al" x="677" y="146">open: load</text></g><g class="arrow dash" data-part="replay"><path d="M440 208 L554 108"/><polygon points="554,108 550.2,117.3 544.3,110.6"/><text class="al" x="466" y="176" text-anchor="end">open: replay</text></g><g class="arrow dash" data-part="recycle"><path d="M540 250 L440 250"/><polygon points="440,250 449,245.5 449,254.5"/><text class="al" x="490" y="244" text-anchor="middle">recycles</text></g><g class="part" data-part="statement"><rect class="box" x="24" y="46" width="136" height="62" rx="6"/><text class="t" x="34" y="66">Statement</text><text class="s" x="34" y="84">a write</text></g><g class="part" data-part="record"><rect class="box" x="200" y="46" width="150" height="62" rx="6"/><text class="t" x="210" y="66">Commit record</text><text class="s" x="210" y="84">physical changes,</text><text class="s" x="210" y="99">not Cypher text</text></g><g class="part" data-part="graph"><rect class="box" x="540" y="46" width="180" height="62" rx="6"/><text class="t" x="550" y="66">In-memory graph</text><text class="s" x="550" y="84">commits up to LSN 3</text><text class="s" x="550" y="99">every query reads here</text></g><g class="part" data-part="wal"><rect class="box" x="140" y="196" width="300" height="66" rx="6"/><text class="t" x="150" y="216">Write-ahead log (WAL)</text><rect class="seg" x="150" y="226" width="280" height="23" rx="3"/><text class="m" x="156" y="241.5">00000002.log (open)</text><g class="chip"><rect class="rec" x="300" y="228" width="30" height="19" rx="3"/><text class="rt" x="315" y="241.5">2</text></g><g class="chip"><rect class="rec" x="334" y="228" width="30" height="19" rx="3"/><text class="rt" x="349" y="241.5">3</text></g></g><g class="part" data-part="snapshot"><rect class="box" x="540" y="196" width="180" height="76" rx="6"/><text class="t" x="550" y="216">Snapshot</text><text class="s" x="550" y="234">manifest.json, codec files</text><text class="s" x="550" y="249">checkpoint LSN 1</text></g></g><text class="pt" x="12" y="362">What a crash 4.6 s after a checkpoint can lose</text><g transform="translate(0 372)"><text class="ct" x="409.96" y="18">crash at 4.6 s</text><g class="row" data-mode="full"><text class="mode" x="12" y="82">full</text><line class="axis" x1="116" y1="78" x2="742" y2="78"/><text class="note" x="411.96" y="50">no acknowledged write lost</text><line class="cp" x1="116" y1="62" x2="116" y2="94"/><circle class="ok" cx="147.3" cy="78" r="5"/><circle class="ok" cx="191.12" cy="78" r="5"/><circle class="ok" cx="234.94" cy="78" r="5"/><circle class="ok" cx="266.24" cy="78" r="5"/><circle class="ok" cx="310.06" cy="78" r="5"/><circle class="ok" cx="347.62" cy="78" r="5"/><circle class="ok" cx="378.92" cy="78" r="5"/><circle class="ok" cx="397.7" cy="78" r="5"/></g><g class="row" data-mode="everysecond"><text class="mode" x="12" y="156">everysecond</text><line class="axis" x1="116" y1="152" x2="742" y2="152"/><rect class="win" x="366.4" y="130" width="37.56" height="34" rx="3"/><text class="wt" x="397.96" y="124" text-anchor="end">can lose 2 writes</text><line class="sy" x1="178.6" y1="143" x2="178.6" y2="161"/><line class="sy" x1="241.2" y1="143" x2="241.2" y2="161"/><line class="sy" x1="303.8" y1="143" x2="303.8" y2="161"/><line class="sy" x1="366.4" y1="143" x2="366.4" y2="161"/><line class="sy" x1="429" y1="143" x2="429" y2="161"/><line class="sy" x1="491.6" y1="143" x2="491.6" y2="161"/><line class="sy" x1="554.2" y1="143" x2="554.2" y2="161"/><line class="sy" x1="616.8" y1="143" x2="616.8" y2="161"/><line class="sy" x1="679.4" y1="143" x2="679.4" y2="161"/><line class="sy" x1="742" y1="143" x2="742" y2="161"/><line class="cp" x1="116" y1="136" x2="116" y2="168"/><circle class="ok" cx="147.3" cy="152" r="5"/><circle class="ok" cx="191.12" cy="152" r="5"/><circle class="ok" cx="234.94" cy="152" r="5"/><circle class="ok" cx="266.24" cy="152" r="5"/><circle class="ok" cx="310.06" cy="152" r="5"/><circle class="ok" cx="347.62" cy="152" r="5"/><circle class="lost" cx="378.92" cy="152" r="5.5"/><line class="x" x1="375.52000000000004" y1="148.6" x2="382.32" y2="155.4"/><line class="x" x1="375.52000000000004" y1="155.4" x2="382.32" y2="148.6"/><circle class="lost" cx="397.7" cy="152" r="5.5"/><line class="x" x1="394.3" y1="148.6" x2="401.09999999999997" y2="155.4"/><line class="x" x1="394.3" y1="155.4" x2="401.09999999999997" y2="148.6"/></g><g class="row" data-mode="snapshot"><text class="mode" x="12" y="230">snapshot</text><line class="axis" x1="116" y1="226" x2="742" y2="226"/><rect class="win" x="116" y="204" width="287.96" height="34" rx="3"/><text class="wt" x="259.98" y="198" text-anchor="middle">can lose 8 writes</text><line class="cp" x1="116" y1="210" x2="116" y2="242"/><circle class="lost" cx="147.3" cy="226" r="5.5"/><line class="x" x1="143.9" y1="222.6" x2="150.70000000000002" y2="229.4"/><line class="x" x1="143.9" y1="229.4" x2="150.70000000000002" y2="222.6"/><circle class="lost" cx="191.12" cy="226" r="5.5"/><line class="x" x1="187.72" y1="222.6" x2="194.52" y2="229.4"/><line class="x" x1="187.72" y1="229.4" x2="194.52" y2="222.6"/><circle class="lost" cx="234.94" cy="226" r="5.5"/><line class="x" x1="231.54" y1="222.6" x2="238.34" y2="229.4"/><line class="x" x1="231.54" y1="229.4" x2="238.34" y2="222.6"/><circle class="lost" cx="266.24" cy="226" r="5.5"/><line class="x" x1="262.84000000000003" y1="222.6" x2="269.64" y2="229.4"/><line class="x" x1="262.84000000000003" y1="229.4" x2="269.64" y2="222.6"/><circle class="lost" cx="310.06" cy="226" r="5.5"/><line class="x" x1="306.66" y1="222.6" x2="313.46" y2="229.4"/><line class="x" x1="306.66" y1="229.4" x2="313.46" y2="222.6"/><circle class="lost" cx="347.62" cy="226" r="5.5"/><line class="x" x1="344.22" y1="222.6" x2="351.02" y2="229.4"/><line class="x" x1="344.22" y1="229.4" x2="351.02" y2="222.6"/><circle class="lost" cx="378.92" cy="226" r="5.5"/><line class="x" x1="375.52000000000004" y1="222.6" x2="382.32" y2="229.4"/><line class="x" x1="375.52000000000004" y1="229.4" x2="382.32" y2="222.6"/><circle class="lost" cx="397.7" cy="226" r="5.5"/><line class="x" x1="394.3" y1="222.6" x2="401.09999999999997" y2="229.4"/><line class="x" x1="394.3" y1="229.4" x2="401.09999999999997" y2="222.6"/></g><line class="crash" x1="403.96" y1="24" x2="403.96" y2="256"/><line class="tick" x1="116" y1="256" x2="116" y2="261"/><text class="tl" x="116" y="274">0</text><line class="tick" x1="178.6" y1="256" x2="178.6" y2="261"/><text class="tl" x="178.6" y="274">1</text><line class="tick" x1="241.2" y1="256" x2="241.2" y2="261"/><text class="tl" x="241.2" y="274">2</text><line class="tick" x1="303.8" y1="256" x2="303.8" y2="261"/><text class="tl" x="303.8" y="274">3</text><line class="tick" x1="366.4" y1="256" x2="366.4" y2="261"/><text class="tl" x="366.4" y="274">4</text><line class="tick" x1="429" y1="256" x2="429" y2="261"/><text class="tl" x="429" y="274">5</text><line class="tick" x1="491.6" y1="256" x2="491.6" y2="261"/><text class="tl" x="491.6" y="274">6</text><line class="tick" x1="554.2" y1="256" x2="554.2" y2="261"/><text class="tl" x="554.2" y="274">7</text><line class="tick" x1="616.8" y1="256" x2="616.8" y2="261"/><text class="tl" x="616.8" y="274">8</text><line class="tick" x1="679.4" y1="256" x2="679.4" y2="261"/><text class="tl" x="679.4" y="274">9</text><line class="tick" x1="742" y1="256" x2="742" y2="261"/><text class="tl" x="742" y="274">10</text><text class="tl" x="429" y="290">seconds since the last completed checkpoint</text><line class="cp" x1="20" y1="302" x2="20" y2="318"/><text class="note" x="30" y="314">completed checkpoint</text><circle class="ok" cx="184" cy="310" r="5"/><text class="note" x="194" y="314">acknowledged, survives</text><circle class="lost" cx="360.8" cy="310" r="5.5"/><line class="x" x1="357.40000000000003" y1="306.6" x2="364.2" y2="313.4"/><line class="x" x1="357.40000000000003" y1="313.4" x2="364.2" y2="306.6"/><text class="note" x="370.8" y="314">acknowledged, can be lost</text><line class="sy" x1="556.8" y1="303" x2="556.8" y2="317"/><text class="note" x="566.8" y="314">background sync</text></g><text class="pt" x="12" y="736">One .rl file, after a checkpoint</text><g transform="translate(0 746)"><text class="t" x="16" y="24">team.rl: one file</text><rect class="file" x="16" y="40" width="330" height="292" rx="8"/><g class="part" data-part="superblock"><rect class="band" x="26" y="50" width="310" height="46" rx="4"/><text class="t" x="36" y="69">Superblock</text><text class="s" x="36" y="86">MDBCLB01, version 1</text></g><g class="part" data-part="snapshot"><rect class="band" x="26" y="104" width="310" height="64" rx="4"/><text class="t" x="36" y="123">Snapshot</text><text class="s" x="36" y="140">manifest.json and the codec's files</text><text class="s" x="36" y="154">checkpoint LSN 3</text></g><g class="part" data-part="wal"><rect class="band" x="26" y="176" width="310" height="56" rx="4"/><text class="t" x="36" y="195">WAL</text><rect class="seg" x="34" y="202" width="294" height="23" rx="3"/><text class="m" x="40" y="217.5">00000003.log (open)</text><text class="s" x="184" y="217.5">no records</text></g><g class="part" data-part="free"><rect class="free" x="26" y="238" width="310" height="78" rx="4"/><text class="s" x="36" y="254">space it keeps and reuses</text></g><text class="note" x="16" y="352">A logical view of its parts, not to scale.</text><text class="note" x="370" y="58">The writer holds the file itself:</text><text class="note" x="370" y="74">no lock files sit beside it.</text><text class="note" x="370" y="104">A --read-only open is refused</text><text class="note" x="370" y="120">while a writer holds the file.</text><text class="note" x="370" y="150">It grows to the most space its</text><text class="note" x="370" y="166">snapshot and WAL needed at once,</text><text class="note" x="370" y="182">then reuses it; it never shrinks.</text><text class="note" x="370" y="212">relate clone writes a compact copy</text><text class="note" x="370" y="228">that holds only the current state.</text></g></svg>
