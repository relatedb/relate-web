<!-- element sha256:370faa82990fcadb1c410d996cc6985000b5c5853129f34fbeea515bbfa1da29 -->
<svg id="rl-file-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px;" viewBox="0 0 760 394" role="img" aria-labelledby="rl-file-light-title rl-file-light-desc"><title id="rl-file-light-title">The parts of one .rl file, as relate documents it</title><desc id="rl-file-light-desc">One .rl file, after a checkpoint: One .rl file holding, top to bottom: the superblock (MDBCLB01, version 1); the snapshot (manifest.json and the codec's files) at checkpoint LSN 3; the WAL (00000003.log with no records); and space the file keeps from parts it no longer needs and reuses for later writes. The parts are drawn in logical order, not to scale.</desc><style>#rl-file-light{font-family:"Relate Sans",system-ui,sans-serif}#rl-file-light{font-family:"Relate Sans",system-ui,sans-serif}#rl-file-light .zone{fill:none;stroke:#E4E7E8;stroke-width:1;stroke-dasharray:6 5}#rl-file-light .zl{font-size:12px;font-weight:600;fill:#59656A;letter-spacing:.04em}#rl-file-light .box{fill:#FAFAFA;stroke:#5F6A6E;stroke-width:1.5}#rl-file-light .on .box{fill:#CDDBE2;stroke:#0A6190;stroke-width:2.5}#rl-file-light .gone .box{fill:none;stroke-dasharray:5 4}#rl-file-light .t{font-size:14px;font-weight:600;fill:#0A1114}#rl-file-light .s{font-size:12px;fill:#59656A}#rl-file-light .m{font-family:"Relate Mono",ui-monospace,monospace;font-size:11.5px;fill:#0A1114}#rl-file-light .pt{font-size:15px;font-weight:600;fill:#0A1114}#rl-file-light .arrow path{fill:none;stroke:#5F6A6E;stroke-width:1.5}#rl-file-light .arrow polygon{fill:#5F6A6E}#rl-file-light .arrow.dash path{stroke-dasharray:5 4}#rl-file-light .arrow.on path{stroke:#0A6190;stroke-width:2.5}#rl-file-light .arrow.on polygon{fill:#0A6190}#rl-file-light .al{font-size:12px;fill:#59656A}#rl-file-light .arrow.on .al{fill:#0A1114;font-weight:600}#rl-file-light .rec{fill:#E8E8E8;stroke:#5F6A6E;stroke-width:1}#rl-file-light .rec.new{fill:#CDDBE2;stroke:#0A6190;stroke-width:2}#rl-file-light .rt{font-size:10.5px;fill:#0A1114;text-anchor:middle}#rl-file-light .seg{fill:#F2F2F2;stroke:#E4E7E8;stroke-width:1}#rl-file-light .sync{fill:#CED9D4;stroke:#145439;stroke-width:1.5}#rl-file-light .syt{font-size:11px;font-weight:600;fill:#0A1114}#rl-file-light .free{fill:none;stroke:#5F6A6E;stroke-width:1.2;stroke-dasharray:4 4}#rl-file-light .axis{stroke:#59656A;stroke-width:1}#rl-file-light .tick{stroke:#59656A;stroke-width:1}#rl-file-light .tl{font-size:11px;fill:#59656A;text-anchor:middle}#rl-file-light .cp{stroke:#0A1114;stroke-width:2.5}#rl-file-light .sy{stroke:#145439;stroke-width:2}#rl-file-light .crash{stroke:#B02A00;stroke-width:2.5}#rl-file-light .ct{font-size:12px;font-weight:600;fill:#B02A00}#rl-file-light .win{fill:#E7D2CB;stroke:#B02A00;stroke-width:1;stroke-dasharray:4 3}#rl-file-light .ok{fill:#145439;stroke:#145439;stroke-width:1.5}#rl-file-light .lost{fill:#F2F2F2;stroke:#B02A00;stroke-width:2}#rl-file-light .x{stroke:#B02A00;stroke-width:1.8}#rl-file-light .mode{font-family:"Relate Mono",ui-monospace,monospace;font-size:13px;font-weight:600;fill:#0A1114}#rl-file-light .row.on .mode{fill:#0A6190}#rl-file-light .wt{font-size:11.5px;font-weight:600;fill:#B02A00}#rl-file-light .note{font-size:12px;fill:#59656A}#rl-file-light .band{fill:#FAFAFA;stroke:#5F6A6E;stroke-width:1.2}#rl-file-light .on .band{fill:#CDDBE2;stroke:#0A6190;stroke-width:2.5}#rl-file-light .file{fill:#F2F2F2;stroke:#0A1114;stroke-width:2}</style><text class="pt" x="12" y="22">One .rl file, after a checkpoint</text><g transform="translate(0 32)"><text class="t" x="16" y="24">team.rl: one file</text><rect class="file" x="16" y="40" width="330" height="292" rx="8"/><g class="part" data-part="superblock"><rect class="band" x="26" y="50" width="310" height="46" rx="4"/><text class="t" x="36" y="69">Superblock</text><text class="s" x="36" y="86">MDBCLB01, version 1</text></g><g class="part" data-part="snapshot"><rect class="band" x="26" y="104" width="310" height="64" rx="4"/><text class="t" x="36" y="123">Snapshot</text><text class="s" x="36" y="140">manifest.json and the codec's files</text><text class="s" x="36" y="154">checkpoint LSN 3</text></g><g class="part" data-part="wal"><rect class="band" x="26" y="176" width="310" height="56" rx="4"/><text class="t" x="36" y="195">WAL</text><rect class="seg" x="34" y="202" width="294" height="23" rx="3"/><text class="m" x="40" y="217.5">00000003.log (open)</text><text class="s" x="184" y="217.5">no records</text></g><g class="part" data-part="free"><rect class="free" x="26" y="238" width="310" height="78" rx="4"/><text class="s" x="36" y="254">space it keeps and reuses</text></g><text class="note" x="16" y="352">A logical view of its parts, not to scale.</text><text class="note" x="370" y="58">The writer holds the file itself:</text><text class="note" x="370" y="74">no lock files sit beside it.</text><text class="note" x="370" y="104">A --read-only open is refused</text><text class="note" x="370" y="120">while a writer holds the file.</text><text class="note" x="370" y="150">It grows to the most space its</text><text class="note" x="370" y="166">snapshot and WAL needed at once,</text><text class="note" x="370" y="182">then reuses it; it never shrinks.</text><text class="note" x="370" y="212">relate clone writes a compact copy</text><text class="note" x="370" y="228">that holds only the current state.</text></g></svg>
