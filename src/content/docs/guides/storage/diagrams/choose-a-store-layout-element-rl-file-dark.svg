<!-- element sha256:4a6c0099a8e976a5bcf2b17e87786c19c121d635481c84b02c20226092055328 -->
<svg id="rl-file-dark" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px;" viewBox="0 0 760 394" role="img" aria-labelledby="rl-file-dark-title rl-file-dark-desc"><title id="rl-file-dark-title">The parts of one .rl file, as relate documents it</title><desc id="rl-file-dark-desc">One .rl file, after a checkpoint: One .rl file holding, top to bottom: the superblock (MDBCLB01, version 1); the snapshot (manifest.json and the codec's files) at checkpoint LSN 3; the WAL (00000003.log with no records); and space the file keeps from parts it no longer needs and reuses for later writes. The parts are drawn in logical order, not to scale.</desc><style>#rl-file-dark{font-family:"Relate Sans",system-ui,sans-serif}#rl-file-dark{font-family:"Relate Sans",system-ui,sans-serif}#rl-file-dark .zone{fill:none;stroke:#3A3A40;stroke-width:1;stroke-dasharray:6 5}#rl-file-dark .zl{font-size:12px;font-weight:600;fill:#9B9BA3;letter-spacing:.04em}#rl-file-dark .box{fill:#101013;stroke:#9B9BA3;stroke-width:1.5}#rl-file-dark .on .box{fill:#2B383D;stroke:#8FE3E8;stroke-width:2.5}#rl-file-dark .gone .box{fill:none;stroke-dasharray:5 4}#rl-file-dark .t{font-size:14px;font-weight:600;fill:#F1F1F3}#rl-file-dark .s{font-size:12px;fill:#9B9BA3}#rl-file-dark .m{font-family:"Relate Mono",ui-monospace,monospace;font-size:11.5px;fill:#F1F1F3}#rl-file-dark .pt{font-size:15px;font-weight:600;fill:#F1F1F3}#rl-file-dark .arrow path{fill:none;stroke:#9B9BA3;stroke-width:1.5}#rl-file-dark .arrow polygon{fill:#9B9BA3}#rl-file-dark .arrow.dash path{stroke-dasharray:5 4}#rl-file-dark .arrow.on path{stroke:#8FE3E8;stroke-width:2.5}#rl-file-dark .arrow.on polygon{fill:#8FE3E8}#rl-file-dark .al{font-size:12px;fill:#9B9BA3}#rl-file-dark .arrow.on .al{fill:#F1F1F3;font-weight:600}#rl-file-dark .rec{fill:#212126;stroke:#9B9BA3;stroke-width:1}#rl-file-dark .rec.new{fill:#2B383D;stroke:#8FE3E8;stroke-width:2}#rl-file-dark .rt{font-size:10.5px;fill:#F1F1F3;text-anchor:middle}#rl-file-dark .seg{fill:#18181C;stroke:#3A3A40;stroke-width:1}#rl-file-dark .sync{fill:#2B3527;stroke:#90CB62;stroke-width:1.5}#rl-file-dark .syt{font-size:11px;font-weight:600;fill:#F1F1F3}#rl-file-dark .free{fill:none;stroke:#9B9BA3;stroke-width:1.2;stroke-dasharray:4 4}#rl-file-dark .axis{stroke:#9B9BA3;stroke-width:1}#rl-file-dark .tick{stroke:#9B9BA3;stroke-width:1}#rl-file-dark .tl{font-size:11px;fill:#9B9BA3;text-anchor:middle}#rl-file-dark .cp{stroke:#F1F1F3;stroke-width:2.5}#rl-file-dark .sy{stroke:#90CB62;stroke-width:2}#rl-file-dark .crash{stroke:#FF8E6A;stroke-width:2.5}#rl-file-dark .ct{font-size:12px;font-weight:600;fill:#FF8E6A}#rl-file-dark .win{fill:#3D2B28;stroke:#FF8E6A;stroke-width:1;stroke-dasharray:4 3}#rl-file-dark .ok{fill:#90CB62;stroke:#90CB62;stroke-width:1.5}#rl-file-dark .lost{fill:#18181C;stroke:#FF8E6A;stroke-width:2}#rl-file-dark .x{stroke:#FF8E6A;stroke-width:1.8}#rl-file-dark .mode{font-family:"Relate Mono",ui-monospace,monospace;font-size:13px;font-weight:600;fill:#F1F1F3}#rl-file-dark .row.on .mode{fill:#8FE3E8}#rl-file-dark .wt{font-size:11.5px;font-weight:600;fill:#FF8E6A}#rl-file-dark .note{font-size:12px;fill:#9B9BA3}#rl-file-dark .band{fill:#101013;stroke:#9B9BA3;stroke-width:1.2}#rl-file-dark .on .band{fill:#2B383D;stroke:#8FE3E8;stroke-width:2.5}#rl-file-dark .file{fill:#18181C;stroke:#F1F1F3;stroke-width:2}</style><text class="pt" x="12" y="22">One .rl file, after a checkpoint</text><g transform="translate(0 32)"><text class="t" x="16" y="24">team.rl: one file</text><rect class="file" x="16" y="40" width="330" height="292" rx="8"/><g class="part" data-part="superblock"><rect class="band" x="26" y="50" width="310" height="46" rx="4"/><text class="t" x="36" y="69">Superblock</text><text class="s" x="36" y="86">MDBCLB01, version 1</text></g><g class="part" data-part="snapshot"><rect class="band" x="26" y="104" width="310" height="64" rx="4"/><text class="t" x="36" y="123">Snapshot</text><text class="s" x="36" y="140">manifest.json and the codec's files</text><text class="s" x="36" y="154">checkpoint LSN 3</text></g><g class="part" data-part="wal"><rect class="band" x="26" y="176" width="310" height="56" rx="4"/><text class="t" x="36" y="195">WAL</text><rect class="seg" x="34" y="202" width="294" height="23" rx="3"/><text class="m" x="40" y="217.5">00000003.log (open)</text><text class="s" x="184" y="217.5">no records</text></g><g class="part" data-part="free"><rect class="free" x="26" y="238" width="310" height="78" rx="4"/><text class="s" x="36" y="254">space it keeps and reuses</text></g><text class="note" x="16" y="352">A logical view of its parts, not to scale.</text><text class="note" x="370" y="58">The writer holds the file itself:</text><text class="note" x="370" y="74">no lock files sit beside it.</text><text class="note" x="370" y="104">A --read-only open is refused</text><text class="note" x="370" y="120">while a writer holds the file.</text><text class="note" x="370" y="150">It grows to the most space its</text><text class="note" x="370" y="166">snapshot and WAL needed at once,</text><text class="note" x="370" y="182">then reuses it; it never shrinks.</text><text class="note" x="370" y="212">relate clone writes a compact copy</text><text class="note" x="370" y="228">that holds only the current state.</text></g></svg>
