.4" x2="382.32" y2="222.6"/><circle class="lost" cx="397.7" cy="226" r="5.5"/><line class="x" x1="394.3" y1="222.6" x2="401.09999999999997" y2="229.4"/><line class="x" x1="394.3" y1="229.4" x2="401.09999999999997" y2="222.6"/></g><line class="crash" x1="403.96" y1="24" x2="403.96" y2="256"/><line class="tick" x1="116" y1="256" x2="116" y2="261"/><text class="tl" x="116" y="274">0</text><line class="tick" x1="178.6" y1="256" x2="178.6" y2="261"/><text class="tl" x="178.6" y="274">1</text><line class="tick" x1="241.2" y1="256" x2="241.2" y2="261"/><text class="tl" x="241.2" y="274">2</text><line class="tick" x1="303.8" y1="256" x2="303.8" y2="261"/><text class="tl" x="303.8" y="274">3</text><line class="tick" x1="366.4" y1="256" x2="366.4" y2="261"/><text class="tl" x="366.4" y="274">4</text><line class="tick" x1="429" y1="256" x2="429" y2="261"/><text class="tl" x="429" y="274">5</text><line class="tick" x1="491.6" y1="256" x2="491.6" y2="261"/><text class="tl" x="491.6" y="274">6</text><line class="tick" x1="554.2" y1="256" x2="554.2" y2="261"/><text class="tl" x="554.2" y="274">7</text><line class="tick" x1="616.8" y1="256" x2="616.8" y2="261"/><text class="tl" x="616.8" y="274">8</text><line class="tick" x1="679.4" y1="256" x2="679.4" y2="261"/><text class="tl" x="679.4" y="274">9</text><line class="tick" x1="742" y1="256" x2="742" y2="261"/><text class="tl" x="742" y="274">10</text><text class="tl" x="429" y="290">seconds since the last completed checkpoint</text><line class="cp" x1="20" y1="302" x2="20" y2="318"/><text class="note" x="30" y="314">completed checkpoint</text><circle class="ok" cx="184" cy="310" r="5"/><text class="note" x="194" y="314">acknowledged, survives</text><circle class="lost" cx="360.8" cy="310" r="5.5"/><line class="x" x1="357.40000000000003" y1="306.6" x2="364.2" y2="313.4"/><line class="x" x1="357.40000000000003" y1="313.4" x2="364.2" y2="306.6"/><text class="note" x="370.8" y="314">acknowledged, can be lost</text><line class="sy" x1="556.8" y1="303" x2="556.8" y2="317"/><text class="note" x="566.8" y="314">background sync</text></g></svg>
