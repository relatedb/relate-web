<!-- element sha256:bbf06eebfc1fcae43c2ed219e3bacc7aefa2a8b71ca7fabbfb6ad7147a13b98c -->
<svg id="loss-windows-light" width="100%" xmlns="http://www.w3.org/2000/svg" style="max-width: 760px;" viewBox="0 0 760 358" role="img" aria-labelledby="loss-windows-light-title loss-windows-light-desc"><title id="loss-windows-light-title">What each durability mode can lose in a crash, as relate documents it</title><desc id="loss-windows-light-desc">What a crash 4.6 s after a checkpoint can lose: Acknowledged writes on a ten-second timeline after a completed checkpoint, with a crash at 4.6 s. Under full, all 8 writes acknowledged before the crash come back: each returned only after its WAL record was synced. Under everysecond, the last background sync was at 4 s, so the 2 writes acknowledged in the 0.6 s after it can be lost. Slow storage or a delayed sync makes the window longer. Under snapshot, nothing is synced on commit, so all 8 writes acknowledged since the last completed checkpoint can be lost. The next timed checkpoint is due at 300 s; a WAL segment that fills, or a clean close, checkpoints sooner.</desc><style>#loss-windows-light{font-family:"Relate Sans",system-ui,sans-serif}#loss-windows-light{font-family:"Relate Sans",system-ui,sans-serif}#loss-windows-light .zone{fill:none;stroke:#E4E7E8;stroke-width:1;stroke-dasharray:6 5}#loss-windows-light .zl{font-size:12px;font-weight:600;fill:#59656A;letter-spacing:.04em}#loss-windows-light .box{fill:#FAFAFA;stroke:#5F6A6E;stroke-width:1.5}#loss-windows-light .on .box{fill:#CDDBE2;stroke:#0A6190;stroke-width:2.5}#loss-windows-light .gone .box{fill:none;stroke-dasharray:5 4}#loss-windows-light .t{font-size:14px;font-weight:600;fill:#0A1114}#loss-windows-light .s{font-size:12px;fill:#59656A}#loss-windows-light .m{font-family:"Relate Mono",ui-monospace,monospace;font-size:11.5px;fill:#0A1114}#loss-windows-light .pt{font-size:15px;font-weight:600;fill:#0A1114}#loss-windows-light .arrow path{fill:none;stroke:#5F6A6E;stroke-width:1.5}#loss-windows-light .arrow polygon{fill:#5F6A6E}#loss-windows-light .arrow.dash path{stroke-dasharray:5 4}#loss-windows-light .arrow.on path{stroke:#0A6190;stroke-width:2.5}#loss-windows-light .arrow.on polygon{fill:#0A6190}#loss-windows-light .al{font-size:12px;fill:#59656A}#loss-windows-light .arrow.on .al{fill:#0A1114;font-weight:600}#loss-windows-light .rec{fill:#E8E8E8;stroke:#5F6A6E;stroke-width:1}#loss-windows-light .rec.new{fill:#CDDBE2;stroke:#0A6190;stroke-width:2}#loss-windows-light .rt{font-size:10.5px;fill:#0A1114;text-anchor:middle}#loss-windows-light .seg{fill:#F2F2F2;stroke:#E4E7E8;stroke-width:1}#loss-windows-light .sync{fill:#CED9D4;stroke:#145439;stroke-width:1.5}#loss-windows-light .syt{font-size:11px;font-weight:600;fill:#0A1114}#loss-windows-light .free{fill:none;stroke:#5F6A6E;stroke-width:1.2;stroke-dasharray:4 4}#loss-windows-light .axis{stroke:#59656A;stroke-width:1}#loss-windows-light .tick{stroke:#59656A;stroke-width:1}#loss-windows-light .tl{font-size:11px;fill:#59656A;text-anchor:middle}#loss-windows-light .cp{stroke:#0A1114;stroke-width:2.5}#loss-windows-light .sy{stroke:#145439;stroke-width:2}#loss-windows-light .crash{stroke:#B02A00;stroke-width:2.5}#loss-windows-light .ct{font-size:12px;font-weight:600;fill:#B02A00}#loss-windows-light .win{fill:#E7D2CB;stroke:#B02A00;stroke-width:1;stroke-dasharray:4 3}#loss-windows-light .ok{fill:#145439;stroke:#145439;stroke-width:1.5}#loss-windows-light .lost{fill:#F2F2F2;stroke:#B02A00;stroke-width:2}#loss-windows-light .x{stroke:#B02A00;stroke-width:1.8}#loss-windows-light .mode{font-family:"Relate Mono",ui-monospace,monospace;font-size:13px;font-weight:600;fill:#0A1114}#loss-windows-light .row.on .mode{fill:#0A6190}#loss-windows-light .wt{font-size:11.5px;font-weight:600;fill:#B02A00}#loss-windows-light .note{font-size:12px;fill:#59656A}#loss-windows-light .band{fill:#FAFAFA;stroke:#5F6A6E;stroke-width:1.2}#loss-windows-light .on .band{fill:#CDDBE2;stroke:#0A6190;stroke-width:2.5}#loss-windows-light .file{fill:#F2F2F2;stroke:#0A1114;stroke-width:2}</style><text class="pt" x="12" y="22">What a crash 4.6 s after a checkpoint can lose</text><g transform="translate(0 32)"><text class="ct" x="409.96" y="18">crash at 4.6 s</text><g class="row" data-mode="full"><text class="mode" x="12" y="82">full</text><line class="axis" x1="116" y1="78" x2="742" y2="78"/><text class="note" x="411.96" y="50">no acknowledged write lost</text><line class="cp" x1="116" y1="62" x2="116" y2="94"/><circle class="ok" cx="147.3" cy="78" r="5"/><circle class="ok" cx="191.12" cy="78" r="5"/><circle class="ok" cx="234.94" cy="78" r="5"/><circle class="ok" cx="266.24" cy="78" r="5"/><circle class="ok" cx="310.06" cy="78" r="5"/><circle class="ok" cx="347.62" cy="78" r="5"/><circle class="ok" cx="378.92" cy="78" r="5"/><circle class="ok" cx="397.7" cy="78" r="5"/></g><g class="row" data-mode="everysecond"><text class="mode" x="12" y="156">everysecond</text><line class="axis" x1="116" y1="152" x2="742" y2="152"/><rect class="win" x="366.4" y="130" width="37.56" height="34" rx="3"/><text class="wt" x="397.96" y="124" text-anchor="end">can lose 2 writes</text><line class="sy" x1="178.6" y1="143" x2="178.6" y2="161"/><line class="sy" x1="241.2" y1="143" x2="241.2" y2="161"/><line class="sy" x1="303.8" y1="143" x2="303.8" y2="161"/><line class="sy" x1="366.4" y1="143" x2="366.4" y2="161"/><line class="sy" x1="429" y1="143" x2="429" y2="161"/><line class="sy" x1="491.6" y1="143" x2="491.6" y2="161"/><line class="sy" x1="554.2" y1="143" x2="554.2" y2="161"/><line class="sy" x1="616.8" y1="143" x2="616.8" y2="161"/><line class="sy" x1="679.4" y1="143" x2="679.4" y2="161"/><line class="sy" x1="742" y1="143" x2="742" y2="161"/><line class="cp" x1="116" y1="136" x2="116" y2="168"/><circle class="ok" cx="147.3" cy="152" r="5"/><circle class="ok" cx="191.12" cy="152" r="5"/><circle class="ok" cx="234.94" cy="152" r="5"/><circle class="ok" cx="266.24" cy="152" r="5"/><circle class="ok" cx="310.06" cy="152" r="5"/><circle class="ok" cx="347.62" cy="152" r="5"/><circle class="lost" cx="378